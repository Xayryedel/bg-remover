<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PhotoLab — редактор и удаление фона</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<header>
  <div class="logo"><span class="dot"></span> PhotoLab</div>
  <div class="pill">Local & Privacy</div>
</header>

<div class="workspace">
  <!-- Область холста -->
  <div class="canvas-area" id="canvasArea">
    <div class="empty-state" id="emptyState">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      <p>Загрузите изображение, чтобы начать</p>
    </div>
    <canvas id="canvas" style="display:none;"></canvas>
  </div>

  <!-- Панель управления -->
  <div class="sidebar">
    <div>
      <div class="section-title">Файл</div>
      <input type="file" id="fileInput" class="file-input" accept="image/*">
      <button class="btn primary" onclick="document.getElementById('fileInput').click()">Загрузить фото</button>
    </div>

    <div id="tools" style="display:none;">
      <div class="section-title">Ретушь</div>
      
      <div class="control-group">
        <label>Яркость <span id="valBrightness">100%</span></label>
        <input type="range" id="brightness" min="0" max="200" value="100">
      </div>
      <div class="control-group">
        <label>Контраст <span id="valContrast">100%</span></label>
        <input type="range" id="contrast" min="0" max="200" value="100">
      </div>
      <div class="control-group">
        <label>Насыщенность <span id="valSaturate">100%</span></label>
        <input type="range" id="saturate" min="0" max="200" value="100">
      </div>
      <div class="control-group">
        <label>Размытие <span id="valBlur">0px</span></label>
        <input type="range" id="blur" min="0" max="20" value="0">
      </div>

      <div class="section-title" style="margin-top:24px;">Инструменты</div>
      <button class="btn ghost" id="removeBgBtn" style="margin-bottom:10px;">🪄 Удалить фон по цвету</button>
      <button class="btn ghost" id="resetBtn" style="margin-bottom:10px;">Сбросить всё</button>
      <button class="btn primary" id="downloadBtn">Скачать PNG</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
