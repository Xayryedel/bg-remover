<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhotoLab — редактор и удаление фона</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #0f1220;
            --card: rgba(255, 255, 255, .06);
            --stroke: rgba(255, 255, 255, .12);
            --text: #eef1f8;
            --muted: #a7aec4;
            --accent: #6ee7b7;
            --accent-2: #60a5fa;
            --radius: 20px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Manrope', system-ui, sans-serif;
            background: radial-gradient(1200px 600px at 10% -10%, rgba(96, 165, 250, .18), transparent 60%),
                        radial-gradient(900px 500px at 100% 0%, rgba(110, 231, 183, .15), transparent 55%), 
                        var(--bg);
            color: var(--text);
            line-height: 1.5;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 18px;
        }
        header {
            width: 100%;
            max-width: 980px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: .3px; }
        .logo .dot { width: 12px; height: 12px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 0 20px rgba(110, 231, 183, .7); }
        
        .header-right { display: flex; align-items: center; gap: 10px; }
        .auth-btn { 
            display: flex; align-items: center; gap: 8px; background: #fff; color: #000; 
            border-radius: 10px; padding: 8px 16px; font-size: 14px; font-weight: 600; 
            border: none; cursor: pointer; transition: 0.2s; font-family: inherit;
        }
        .auth-btn:hover { background: #eee; box-shadow: 0 2px 10px rgba(255,255,255,0.2); }
        .user-profile { 
            display: flex; align-items: center; gap: 10px; background: var(--card); 
            border: 1px solid var(--stroke); padding: 5px 10px 5px 5px; border-radius: 999px; 
        }
        .user-profile img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 1px solid rgba(255,255,255,0.2); }
        .user-profile span { font-size: 14px; font-weight: 600; }
        .logout-btn { 
            background: transparent; border: none; color: var(--muted); font-size: 12px; 
            cursor: pointer; text-decoration: underline; margin-left: 5px; font-family: inherit;
        }
        .logout-btn:hover { color: #ff4d4d; }

        .workspace { width: 100%; max-width: 980px; display: grid; grid-template-columns: 1fr 320px; gap: 20px; }
        @media (max-width: 800px) { .workspace { grid-template-columns: 1fr; } }

        .canvas-area {
            background: var(--card); border: 1px solid var(--stroke); border-radius: var(--radius);
            padding: 20px; display: flex; align-items: center; justify-content: center; min-height: 400px;
            position: relative; overflow: hidden;
        }
        canvas { max-width: 100%; max-height: 70vh; border-radius: 12px; display: block; box-shadow: 0 10px 30px rgba(0, 0, 0, .4); }
        .empty-state { text-align: center; color: var(--muted); }
        .empty-state svg { width: 64px; height: 64px; margin-bottom: 16px; opacity: .5; }

        .sidebar { background: var(--card); border: 1px solid var(--stroke); border-radius: var(--radius); padding: 20px; display: flex; flex-direction: column; gap: 20px; height: fit-content; }
        .section-title { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 10px; font-weight: 700; }

        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            border: none; border-radius: 14px; padding: 14px 20px; font-family: inherit; font-weight: 700; font-size: 15px;
            cursor: pointer; transition: transform .15s ease, filter .15s ease; width: 100%;
        }
        .btn:active { transform: scale(.97); }
        .btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #0b1020; }
        .btn.primary:hover { filter: brightness(1.06); }
        .btn.ghost { background: transparent; border: 1px solid var(--stroke); color: var(--text); }
        .btn.ghost:hover { background: rgba(255, 255, 255, .05); }

        .control-group { margin-bottom: 16px; }
        .control-group label { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; color: var(--text); }
        .control-group label span { color: var(--muted); font-size: 12px; }

        input[type="range"] { width: 100%; -webkit-appearance: none; background: rgba(255, 255, 255, .1); height: 6px; border-radius: 3px; outline: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); cursor: pointer; box-shadow: 0 0 10px rgba(110, 231, 183, .5); }
        .file-input { display: none; }

        .loader { display: none; position: absolute; inset: 0; background: rgba(15, 18, 32, .85); z-index: 10; flex-direction: column; align-items: center; justify-content: center; gap: 16px; border-radius: var(--radius); }
        .loader.active { display: flex; }
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(255, 255, 255, .1); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg) } }
        .loader-text { font-size: 14px; color: var(--muted); }
    </style>
</head>
<body>

    <header>
        <div class="logo"><span class="dot"></span> PhotoLab</div>
        
        <div class="header-right" id="authContainer">
            <button id="loginBtn" class="auth-btn">
                <svg viewBox="0 0 24 24" width="16" height="16"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                Войти
            </button>
            <div id="userProfile" class="user-profile" style="display:none;">
                <img id="userAvatar" src="" alt="Аватар">
                <span id="userName"></span>
                <button id="logoutBtn" class="logout-btn" title="Выйти">Выйти</button>
            </div>
        </div>
    </header>

    <div class="workspace">
        <div class="canvas-area" id="canvasArea">
            <div class="empty-state" id="emptyState">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <rect x="3" y="3" width="18" height="18" rx="2"/>
                    <circle cx="8.5" cy="8.5" r="1.5"/>
                    <path d="M21 15l-5-5L5 21"/>
                </svg>
                <p>Загрузите изображение, чтобы начать</p>
            </div>
            <canvas id="canvas" style="display:none;"></canvas>
            
            <div class="loader" id="loader">
                <div class="spinner"></div>
                <div class="loader-text" id="loaderText">Загрузка нейросети...</div>
            </div>
        </div>

        <div class="sidebar">
            <div>
                <div class="section-title">Файл</div>
                <input type="file" id="fileInput" class="file-input" accept="image/*">
                <button class="btn primary" id="uploadBtn">Загрузить фото</button>
            </div>

            <div id="tools" style="display:none;">
                <div class="section-title">Ретушь</div>
                
                <div class="control-group">
                    <label>Яркость <span id="valBrightness">100%</span></label>
                    <input type="range" id="brightness" min="0" max="200" value="100">
                </div>
                <div class="control-group">
                    <label>Контраст <span id="valContrast">100%</span></label>
                    <input type="range" id="contrast" min="0" max="200" value="100">
                </div>
                <div class="control-group">
                    <label>Насыщенность <span id="valSaturate">100%</span></label>
                    <input type="range" id="saturate" min="0" max="200" value="100">
                </div>
                <div class="control-group">
                    <label>Размытие <span id="valBlur">0px</span></label>
                    <input type="range" id="blur" min="0" max="20" value="0">
                </div>

                <div class="section-title" style="margin-top:24px;">Инструменты</div>
                <button class="btn ghost" id="removeBgBtn" style="margin-bottom:10px;">✨ Удалить фон (AI)</button>
                <button class="btn ghost" id="resetBtn" style="margin-bottom:10px;">Сбросить всё</button>
                <button class="btn primary" id="downloadBtn">Скачать PNG</button>
            </div>
        </div>
    </div>

    <script type="module">
        // === ИМПОРТЫ ===
        import { removeBackground } from "https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm";
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";

        // === КОНФИГ FIREBASE ===
        const firebaseConfig = {
          apiKey: "AIzaSyDSWaq-t5lJVxlh-PtXiRyo6GZOA_uzhg8",
          authDomain: "photolab-ef572.firebaseapp.com",
          projectId: "photolab-ef572",
          storageBucket: "photolab-ef572.firebasestorage.app",
          messagingSenderId: "168894868190",
          appId: "1:168894868190:web:0fc6e560aad5aec3afb04f"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        document.addEventListener('DOMContentLoaded', () => {
            // === АВТОРИЗАЦИЯ ===
            const loginBtn = document.getElementById('loginBtn');
            const logoutBtn = document.getElementById('logoutBtn');
            const userProfile = document.getElementById('userProfile');
            const userAvatar = document.getElementById('userAvatar');
            const userName = document.getElementById('userName');

            loginBtn.addEventListener('click', () => {
                signInWithPopup(auth, provider).catch((error) => {
                    console.error("Ошибка входа:", error);
                    alert("Не удалось войти. Проверьте настройки домена в Firebase.");
                });
            });

            logoutBtn.addEventListener('click', () => {
                signOut(auth);
            });

            onAuthStateChanged(auth, (user) => {
                if (user) {
                    loginBtn.style.display = 'none';
                    userProfile.style.display = 'flex';
                    userName.textContent = user.displayName ? user.displayName.split(' ')[0] : 'User';
                    userAvatar.src = user.photoURL || 'https://via.placeholder.com/32';
                } else {
                    loginBtn.style.display = 'flex';
                    userProfile.style.display = 'none';
                }
            });

            // === ЛОГИКА РЕДАКТОРА ===
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            const fileInput = document.getElementById('fileInput');
            const uploadBtn = document.getElementById('uploadBtn');
            const emptyState = document.getElementById('emptyState');
            const tools = document.getElementById('tools');
            const loader = document.getElementById('loader');
            const loaderText = document.getElementById('loaderText');
            
            const removeBgBtn = document.getElementById('removeBgBtn');
            const downloadBtn = document.getElementById('downloadBtn');
            const resetBtn = document.getElementById('resetBtn');

            let originalImage = null;
            let currentFile = null;

            const brightness = document.getElementById('brightness');
            const contrast = document.getElementById('contrast');
            const saturate = document.getElementById('saturate');
            const blur = document.getElementById('blur');
            
            const valBrightness = document.getElementById('valBrightness');
            const valContrast = document.getElementById('valContrast');
            const valSaturate = document.getElementById('valSaturate');
            const valBlur = document.getElementById('valBlur');

            uploadBtn.addEventListener('click', () => fileInput.click());

            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                currentFile = file;

                const reader = new FileReader();
                reader.onload = (event) => loadImage(event.target.result);
                reader.readAsDataURL(file);
            });

            function loadImage(src) {
                const img = new Image();
                img.onload = () => {
                    originalImage = img;
                    canvas.width = img.width;
                    canvas.height = img.height;
                    
                    canvas.style.display = 'block';
                    emptyState.style.display = 'none';
                    tools.style.display = 'block';
                    
                    resetFilters();
                    applyFilters();
                };
                img.src = src;
            }

            function applyFilters() {
                if (!originalImage) return;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                const b = brightness.value;
                const c = contrast.value;
                const s = saturate.value;
                const bl = blur.value;
                
                ctx.filter = `brightness(${b}%) contrast(${c}%) saturate(${s}%) blur(${bl}px)`;
                ctx.drawImage(originalImage, 0, 0);
                
                valBrightness.textContent = b + '%';
                valContrast.textContent = c + '%';
                valSaturate.textContent = s + '%';
                valBlur.textContent = bl + 'px';
            }

            [brightness, contrast, saturate, blur].forEach(el => el.addEventListener('input', applyFilters));

            function resetFilters() {
                brightness.value = 100;
                contrast.value = 100;
                saturate.value = 100;
                blur.value = 0;
            }

            resetBtn.addEventListener('click', () => {
                resetFilters();
                if (originalImage) loadImage(originalImage.src);
            });

            // === УДАЛЕНИЕ ФОНА С ОБХОДОМ ОШИБОК FETCH ===
            removeBgBtn.addEventListener('click', async () => {
                if (!currentFile) return;

                loader.classList.add('active');
                loaderText.textContent = 'Нейросеть загружается...';

                try {
                    // Создаем URL-объект для файла
                    const fileUrl = URL.createObjectURL(currentFile);

                    // Вызываем библиотеку с правильными настройками
                    const blob = await removeBackground(fileUrl, {
                        model: "isnet_quint8", // Самая легкая модель
                        device: "cpu",         // Работает везде
                        // Отключаем все проверки CORS и воркеров (из-за них падало)
                        debug: false,
                        progress: (key, current, total) => {
                            loaderText.textContent = `Загрузка: ${Math.round((current/total)*100)}%`;
                        }
                    });

                    // Убираем за собой
                    URL.revokeObjectURL(fileUrl);

                    loaderText.textContent = 'Применяем результат...';
                    const url = URL.createObjectURL(blob);
                    
                    const newImg = new Image();
                    newImg.onload = () => {
                        originalImage = newImg;
                        canvas.width = newImg.width;
                        canvas.height = newImg.height;
                        
                        resetFilters();
                        applyFilters();
                        loader.classList.remove('active');
                        
                        // Освобождаем память
                        URL.revokeObjectURL(url);
                    };
                    newImg.src = url;

                } catch (error) {
                    console.error("Ошибка удаления фона:", error);
                    alert('Ошибка: ' + error.message + '\n\nПопробуйте использовать другое фото.');
                    loader.classList.remove('active');
                }
            });

            downloadBtn.addEventListener('click', () => {
                if (!originalImage) return;
                const link = document.createElement('a');
                link.download = 'photolab-ai-result.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        });
    </script>
</body>
</html>
